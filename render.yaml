# Render blueprint. Tres servicios: el API (Web Service) y panel + landing
# como Static Sites, cada uno en su propia URL de *.onrender.com por ahora.
# La unificación bajo un único dominio (fightersgym.com) vía rewrites de la
# landing — ver §5 del plan — queda pendiente hasta tener el dominio
# comprado; hoy solo hace falta que Rafa pueda entrar a probar.
#
# El API va en plan "free" a propósito (no "starter", ~7$/mes): sin tarjeta
# de por medio por ahora. El coste real es que se duerme a los 15 min sin
# tráfico y la primera visita del día tarda 30-50s en despertar — asumible
# mientras solo lo prueba Rafa. Cuando convenga pasar a Starter, se cambia
# el plan desde el propio dashboard de Render, sin tocar código.
services:
  - type: web
    name: fighters-gym-api
    runtime: node
    plan: free
    # Frankfurt, no el Oregon por defecto de Render: el gimnasio está en
    # Valencia y la base de datos de Neon (ver DATABASE_URL) ya vive en
    # eu-central-1 (Frankfurt) — así se minimiza la latencia tanto hacia el
    # panel/landing como hacia la propia base de datos.
    region: frankfurt
    healthCheckPath: /health
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @fighters-gym/api prisma:generate && pnpm --filter @fighters-gym/api build
    startCommand: pnpm --filter @fighters-gym/api start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # URL real del panel una vez desplegado (p. ej. https://fighters-gym-panel.onrender.com)
      # — CORS con credentials:true exige un origen exacto, no vale "*".
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: fighters-gym-panel
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @fighters-gym/panel build
    staticPublishPath: apps/panel/dist
    envVars:
      # URL real del API una vez desplegado (p. ej. https://fighters-gym-api.onrender.com)
      # — VITE_API_URL se hornea en el build, así que hay que ponerla ANTES de desplegar el panel.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA de una sola página (React Router) — cualquier ruta que no sea un
      # archivo real cae en index.html, si no un F5 en /alumnos/nuevo da 404.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: fighters-gym
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @fighters-gym/landing build
    staticPublishPath: apps/landing/out
